name: Website CI

on:
  push:
    branches: [master, stage, main]
  pull_request:
    branches: [master, stage, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Unit tests
        id: test
        run: npm test

      - name: Lint
        id: lint
        run: npm run lint

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Build
        id: build
        run: npm run build
        env:
          NUXT_PUBLIC_SITE_URL: https://deflowlabs.io
          NUXT_SANITY_PROJECT_ID: i34vbeac
          NUXT_SANITY_DATASET: production
          NUXT_SANITY_API_VERSION: 2026-08-17
          NUXT_SANITY_STUDIO_ORIGIN: https://studio.deflowlabs.io
          # Non-secret sentinel: compiles the server-only Visual Editing path in CI.
          SANITY_API_READ_TOKEN: ci-visual-editing-build-token

      - name: Audit production dependencies
        id: audit
        run: npm audit --omit=dev --audit-level=high

      - name: Publish website summary
        if: always()
        run: |
          {
            echo '## Website quality'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo '| Unit tests | `${{ steps.test.outcome }}` |'
            echo '| Lint | `${{ steps.lint.outcome }}` |'
            echo '| Typecheck | `${{ steps.typecheck.outcome }}` |'
            echo '| Production build | `${{ steps.build.outcome }}` |'
            echo '| Production dependency audit | `${{ steps.audit.outcome }}` |'
          } >> "$GITHUB_STEP_SUMMARY"
